name: Release SwissTechKnife module

# A new module version on main publishes v<version> with the package <id>-<version>.zip. The SwissTechKnife
# catalog sync picks the release up on its own (docs/MODULES.md in the host repository); notes for the catalog
# come from the "releaseNotes" entry for that version in module.json.
on:
  push:
    branches: [main]
    paths: ['Directory.Build.props', 'src/Tamarillo/module.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: module-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      # Tests run on their own and pass on their result line: on Windows Server runners the test process can
      # fail fast (0xC000000D) while tearing down WinRT/Media Foundation after every test passed (ERRORS.md).
      - name: Build package
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -SkipTests
      - name: Test
        shell: pwsh
        run: |
          $lines = @(& tests/Tamarillo.Tests/bin/Release/net48/Tamarillo.Tests.exe)
          $code = $LASTEXITCODE
          $lines | Write-Host
          $summary = $lines -match '^\d+ passed, \d+ failed$' | Select-Object -Last 1
          if ($summary -notmatch ' 0 failed$') { throw "Tests failed (exit code $code): $summary" }
          if ($code -ne 0) { Write-Host "All tests passed; ignoring exit code $code from process teardown." }
          exit 0
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content 'src/Tamarillo/module.json' -Raw | ConvertFrom-Json
          $version = $manifest.version
          $tag = "v$version"
          $zip = "artifacts/$($manifest.id)-$version.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "$zip was not produced." }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "| Package | sha256 | size |`n|---|---|---|`n| ``$(Split-Path -Leaf $zip)`` | ``$hash`` | $((Get-Item $zip).Length) |" | Add-Content $env:GITHUB_STEP_SUMMARY
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; nothing to publish."; exit 0 }
          $own = @($manifest.releaseNotes | Where-Object { $_.version -eq $version }) | Select-Object -First 1
          $notes = @($own.notes | ForEach-Object { "- $_" }) -join "`n"
          if (-not $notes) { $notes = "Version $version." }
          gh release create $tag $zip --target $env:GITHUB_SHA --title "Tamarillo $version" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish $tag." }
      - uses: actions/upload-artifact@v4
        with:
          name: module-package
          path: artifacts/*.zip
          if-no-files-found: error
